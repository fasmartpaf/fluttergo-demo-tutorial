# Generated by FlutterGo.AI — Mobile App Deployment (github_actions mode).
name: FlutterGo Deploy

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "android | ios | both"
        required: true
        default: "android"
      track:
        description: "internal/alpha/beta/production or testflight/app_store"
        required: false
        default: "internal"
      android_track:
        description: "Play track (internal/alpha/beta/production)"
        required: false
        default: "internal"
      ios_track:
        description: "testflight | app_store"
        required: false
        default: "testflight"
      build_name:
        description: "Marketing version (e.g. 1.0.0)"
        required: false
      build_number:
        description: "Build number"
        required: false
      release_notes:
        description: "What is new in this release (Google Play)"
        required: false
      rollout:
        description: "Production staged rollout percentage (1-100)"
        required: false

jobs:
  android:
    name: Android · Google Play
    if: github.event.inputs.platform == 'android' || github.event.inputs.platform == 'both'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore the app's env files
        env:
          FLUTTERGO_APP_ENV_FILES: ${{ secrets.FLUTTERGO_APP_ENV_FILES }}
        run: |
          if [ -z "$FLUTTERGO_APP_ENV_FILES" ]; then
            echo "No app env files to restore."
            exit 0
          fi
          python3 - <<'PY'
          import base64, json, os, pathlib
          files = json.loads(base64.b64decode(os.environ["FLUTTERGO_APP_ENV_FILES"]).decode("utf-8"))
          for rel, content in files.items():
              p = pathlib.Path(rel)
              if p.is_absolute() or ".." in p.parts:
                  raise SystemExit(f"Refusing to write outside the repository: {rel}")
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding="utf-8")
              print(f"Restored {rel}")
          PY

      - name: Stage Firebase config from Secrets vault
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" ]; then
            mkdir -p android/app
            echo "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            test -s android/app/google-services.json
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build version args
        id: ver
        env:
          BUILD_NAME: ${{ github.event.inputs.build_name }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: |
          ARGS=""
          if [ -n "$BUILD_NAME" ]; then
            if ! printf '%s' "$BUILD_NAME" | grep -Eq '^[0-9]{1,9}([.][0-9]{1,9}){0,3}$'; then echo "::error::build_name must look like 1.2.3"; exit 1; fi
            ARGS="$ARGS --build-name=$BUILD_NAME"
          fi
          if [ -n "$BUILD_NUMBER" ]; then
            if ! printf '%s' "$BUILD_NUMBER" | grep -Eq '^[0-9]{1,10}$'; then echo "::error::build_number must be a whole number"; exit 1; fi
            ARGS="$ARGS --build-number=$BUILD_NUMBER"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            STORE_FILE="upload-keystore.jks"
            if [ -n "$ANDROID_KEY_PROPERTIES" ]; then
              SF=$(printf '%s' "$ANDROID_KEY_PROPERTIES" | grep -E '^storeFile=' | head -1 | cut -d= -f2-)
              if [ -n "$SF" ]; then STORE_FILE="$SF"; fi
            fi
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "android/app/$STORE_FILE"
          fi
          if [ -n "$ANDROID_KEY_PROPERTIES" ]; then
            printf '%s' "$ANDROID_KEY_PROPERTIES" > android/key.properties
          fi

      - name: Build Android App Bundle
        run: flutter build appbundle --release ${{ steps.ver.outputs.args }}

      # flutter create signs release builds with the debug key, and Play
      # rejects those. FlutterGo points release signing at key.properties
      # before pushing; this catches a build that still is not signed with it.
      - name: Check the release signing key
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          CERT=$(keytool -printcert -jarfile "$AAB" 2>&1 || true)
          if printf '%s' "$CERT" | grep -q "CN=Android Debug"; then
            echo "::error::The App Bundle is signed with the Android debug key, and Google Play rejects it. The release signingConfig in android/app/build.gradle must use the upload keystore from android/key.properties."
            exit 1
          fi
          if printf '%s' "$CERT" | grep -qi "not a signed jar"; then
            echo "::error::The App Bundle is not signed. The release signingConfig in android/app/build.gradle must use the upload keystore from android/key.properties."
            exit 1
          fi
          echo "Signed with the upload key."

      # Google Play takes a brand-new app's first bundle only by hand, in Play
      # Console: keep the signed bundle on the run so it can be downloaded.
      - name: Keep the signed App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Release notes and rollout
        id: play
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
          ROLLOUT: ${{ github.event.inputs.rollout }}
          TRACK: ${{ github.event.inputs.android_track || github.event.inputs.track }}
        run: |
          STATUS=completed
          FRACTION=""
          if [ -n "$ROLLOUT" ] && [ "$TRACK" = "production" ]; then
            if ! printf '%s' "$ROLLOUT" | grep -Eq '^[0-9]{1,3}$' || [ "$ROLLOUT" -lt 1 ] || [ "$ROLLOUT" -gt 100 ]; then
              echo "::error::rollout must be a whole percentage from 1 to 100"
              exit 1
            fi
            if [ "$ROLLOUT" -lt 100 ]; then
              STATUS=inProgress
              FRACTION=$(awk -v p="$ROLLOUT" 'BEGIN { printf "%.2f", p / 100 }')
            fi
          fi
          NOTES_DIR=""
          if [ -n "$RELEASE_NOTES" ]; then
            NOTES_DIR="$RUNNER_TEMP/whatsnew"
            mkdir -p "$NOTES_DIR"
            printf '%s' "$RELEASE_NOTES" > "$NOTES_DIR/whatsnew-en-US"
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "user_fraction=$FRACTION" >> "$GITHUB_OUTPUT"
          echo "whatsnew_dir=$NOTES_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload to Google Play
        id: play_upload
        # A new app that was never published takes only draft releases
        # ("Only releases with status draft may be created on draft app"):
        # the next step retries as a draft instead of failing the deploy.
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ secrets.ANDROID_PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.android_track || github.event.inputs.track }}
          status: ${{ steps.play.outputs.status }}
          userFraction: ${{ steps.play.outputs.user_fraction }}
          whatsNewDirectory: ${{ steps.play.outputs.whatsnew_dir }}

      - name: Upload to Google Play as a draft (new app)
        if: steps.play_upload.outcome == 'failure'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ secrets.ANDROID_PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ github.event.inputs.android_track || github.event.inputs.track }}
          status: draft
          whatsNewDirectory: ${{ steps.play.outputs.whatsnew_dir }}

      - name: Draft release note
        if: steps.play_upload.outcome == 'failure'
        run: echo "::notice title=FlutterGo::Uploaded to Google Play as a DRAFT release (the app is not published yet). Open Play Console → your app → Testing → finish the store listing and roll out the draft."

  ios:
    name: iOS · App Store Connect
    if: github.event.inputs.platform == 'ios' || github.event.inputs.platform == 'both'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore the app's env files
        env:
          FLUTTERGO_APP_ENV_FILES: ${{ secrets.FLUTTERGO_APP_ENV_FILES }}
        run: |
          if [ -z "$FLUTTERGO_APP_ENV_FILES" ]; then
            echo "No app env files to restore."
            exit 0
          fi
          python3 - <<'PY'
          import base64, json, os, pathlib
          files = json.loads(base64.b64decode(os.environ["FLUTTERGO_APP_ENV_FILES"]).decode("utf-8"))
          for rel, content in files.items():
              p = pathlib.Path(rel)
              if p.is_absolute() or ".." in p.parts:
                  raise SystemExit(f"Refusing to write outside the repository: {rel}")
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding="utf-8")
              print(f"Restored {rel}")
          PY

      - name: Stage Firebase config from Secrets vault
        env:
          FIREBASE_IOS_PLIST_BASE64: ${{ secrets.FIREBASE_IOS_PLIST_BASE64 }}
        run: |
          if [ -n "$FIREBASE_IOS_PLIST_BASE64" ]; then
            mkdir -p ios/Runner
            echo "$FIREBASE_IOS_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
            test -s ios/Runner/GoogleService-Info.plist
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build version args
        id: ver
        env:
          BUILD_NAME: ${{ github.event.inputs.build_name }}
          BUILD_NUMBER: ${{ github.event.inputs.build_number }}
        run: |
          ARGS=""
          if [ -n "$BUILD_NAME" ]; then
            if ! printf '%s' "$BUILD_NAME" | grep -Eq '^[0-9]{1,9}([.][0-9]{1,9}){0,3}$'; then echo "::error::build_name must look like 1.2.3"; exit 1; fi
            ARGS="$ARGS --build-name=$BUILD_NAME"
          fi
          if [ -n "$BUILD_NUMBER" ]; then
            if ! printf '%s' "$BUILD_NUMBER" | grep -Eq '^[0-9]{1,10}$'; then echo "::error::build_number must be a whole number"; exit 1; fi
            ARGS="$ARGS --build-number=$BUILD_NUMBER"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DIST_CERT_PASSWORD }}

      - name: Verify Distribution certificate
        run: |
          if ! security find-identity -v -p codesigning | grep -q "Apple Distribution"; then
            echo "Apple Distribution certificate not found in the keychain."
            echo "Upload an Apple Distribution .p12 (not a Development cert) in FlutterGo deploy credentials."
            security find-identity -v -p codesigning || true
            exit 1
          fi

      - name: Stage App Store Connect API key
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          # Use $HOME — a quoted "~/..." path does not expand and fails the write.
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_API_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          test -s "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      # Firebase / modern plugins need iOS 15+. Project templates often still say 13.0.
      - name: Raise iOS deployment target to 15.0
        run: |
          if [ -f ios/Podfile ]; then
            if grep -qE "platform :ios" ios/Podfile; then
              sed -i.bak -E "s/platform :ios, *'[0-9.]+'/platform :ios, '15.0'/" ios/Podfile || true
            else
              { echo "platform :ios, '15.0'"; cat ios/Podfile; } > ios/Podfile.tmp && mv ios/Podfile.tmp ios/Podfile
            fi
          fi
          if [ -f ios/Runner.xcodeproj/project.pbxproj ]; then
            sed -i.bak 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' \
              ios/Runner.xcodeproj/project.pbxproj
          fi

      # flutter_launcher_icons writes legacy Contents.json (no Any Appearance well).
      # Xcode 26 / altool rejects that with 91111 — rewrite to Single Size before archive.
      - name: Fix iOS AppIcon Any Appearance (altool 91111)
        run: |
          set -euo pipefail
          SET="ios/Runner/Assets.xcassets/AppIcon.appiconset"
          if [ ! -d "$SET" ]; then
            echo "No AppIcon.appiconset — skipping"
            exit 0
          fi
          SRC=""
          for c in \
            "$SET/Icon-App-1024x1024@1x.png" \
            "$SET/ItunesArtwork@2x.png" \
            assets/branding/app_icon_master_1024.png \
            assets/images/branding/app_icon_1024.png \
            assets/images/branding/app_icon_master_1024.png
          do
            if [ -f "$c" ]; then SRC="$c"; break; fi
          done
          if [ -z "$SRC" ]; then
            SRC=$(find "$SET" -maxdepth 1 -name '*.png' | head -1 || true)
          fi
          if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then
            echo "ERROR: no PNG source found for App Store icon (1024 Any Appearance)."
            ls -la "$SET" || true
            exit 1
          fi
          echo "Using icon source: $SRC"
          OUT="$SET/Icon-App-1024x1024@1x.png"
          sips -z 1024 1024 "$SRC" --out "$OUT" >/dev/null
          # App Store rejects transparent marketing icons — flatten alpha via BMP round-trip.
          if sips -g hasAlpha "$OUT" 2>/dev/null | grep -q 'hasAlpha: yes'; then
            sips -s format bmp "$OUT" --out "$RUNNER_TEMP/appicon-flat.bmp" >/dev/null
            sips -s format png "$RUNNER_TEMP/appicon-flat.bmp" --out "$OUT" >/dev/null
          fi
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("ios/Runner/Assets.xcassets/AppIcon.appiconset/Contents.json")
          base = {
              "filename": "Icon-App-1024x1024@1x.png",
              "idiom": "universal",
              "platform": "ios",
              "size": "1024x1024",
          }
          data = {
              "images": [
                  dict(base),
                  {**base, "appearances": [{"appearance": "luminosity", "value": "dark"}]},
                  {**base, "appearances": [{"appearance": "luminosity", "value": "tinted"}]},
              ],
              "info": {"author": "xcode", "version": 1},
          }
          p.write_text(json.dumps(data, indent=2) + "\n")
          print("Wrote Single Size AppIcon Contents.json (Any/Dark/Tinted)")
          PY
          sips -g pixelWidth -g pixelHeight "$OUT"

      - name: Build iOS IPA (xcodebuild + ASC API key)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          # Archive with automatic signing (do NOT pass CODE_SIGN_IDENTITY globally —
          # that conflicts with SPM/Pods auto-Development signing). Prefer local
          # App Store profile export when APPLE_PROVISIONING_PROFILE_BASE64 is set.
          set -euo pipefail
          flutter build ios --release --no-codesign ${{ steps.ver.outputs.args }}

          if ! security find-identity -v -p codesigning | grep -q "Apple Distribution"; then
            echo "Apple Distribution certificate not found in the keychain."
            echo "Upload an Apple Distribution .p12 (not a Development cert) in FlutterGo deploy credentials."
            security find-identity -v -p codesigning || true
            exit 1
          fi

          PROFILE_UUID=""
          PROFILE_NAME=""
          PROFILE_PLIST=""
          if [ -n "${APPLE_PROVISIONING_PROFILE_BASE64:-}" ]; then
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
            PROFILE_PATH="$RUNNER_TEMP/FlutterGo_AppStore.mobileprovision"
            echo "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
            PROFILE_PLIST="$RUNNER_TEMP/FlutterGo_profile.plist"
            security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
            PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
            PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST" 2>/dev/null || echo "FlutterGo App Store")
            PROFILE_TYPE=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:get-task-allow' "$PROFILE_PLIST" 2>/dev/null || echo false)
            if [ "$PROFILE_TYPE" = "true" ]; then
              echo "ERROR: uploaded profile is Development (get-task-allow=true)."
              echo "Create an App Store Connect distribution profile for $IOS_BUNDLE_ID and upload that .mobileprovision."
              exit 1
            fi
            cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
            echo "Installed App Store profile: $PROFILE_NAME ($PROFILE_UUID)"
          fi

          # Flutter templates often ship without DEVELOPMENT_TEAM. With set -e, a bare
          # grep exit 1 aborts silently — resolve team from profile/cert before archive.
          TEAM_ID=""
          if [ -f ios/Runner.xcodeproj/project.pbxproj ]; then
            TEAM_ID=$(grep -oE 'DEVELOPMENT_TEAM = [A-Z0-9]+;' ios/Runner.xcodeproj/project.pbxproj | head -1 | awk '{print $3}' | tr -d ';' || true)
          fi
          if [ -z "$TEAM_ID" ] && [ -n "$PROFILE_PLIST" ]; then
            TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$PROFILE_PLIST" 2>/dev/null || true)
          fi
          if [ -z "$TEAM_ID" ]; then
            TEAM_ID=$(security find-identity -v -p codesigning | grep 'Apple Distribution' | head -1 | sed -n 's/.*(\([A-Z0-9]\{10\}\)\").*/\1/p' || true)
          fi
          if [ -z "$TEAM_ID" ]; then
            echo "DEVELOPMENT_TEAM missing — set your Apple Team ID in ios/Runner.xcodeproj or upload an App Store .mobileprovision that contains TeamIdentifier."
            exit 1
          fi
          echo "Using DEVELOPMENT_TEAM=$TEAM_ID"

          ARCHIVE_PATH="$PWD/build/ios/archive/Runner.xcarchive"
          EXPORT_PATH="$PWD/build/ios/ipa"
          mkdir -p "$(dirname "$ARCHIVE_PATH")" "$EXPORT_PATH"

          if [ -n "$PROFILE_UUID" ]; then
            # App Store profile + Distribution cert: sign the archive manually.
            # Do NOT use -allowProvisioningUpdates here — Xcode would try to create
            # Development profiles and fail with "no devices registered" on CI.
            PBX=ios/Runner.xcodeproj/project.pbxproj
            echo "Manual archive signing with App Store profile (no registered devices required)"
            sed -i.bak 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' "$PBX"
            sed -i.bak "s/DEVELOPMENT_TEAM = [A-Z0-9]*/DEVELOPMENT_TEAM = $TEAM_ID/g" "$PBX"
            sed -i.bak 's/CODE_SIGN_IDENTITY = "iPhone Developer"/CODE_SIGN_IDENTITY = "Apple Distribution"/g' "$PBX"
            sed -i.bak 's/CODE_SIGN_IDENTITY = "Apple Development"/CODE_SIGN_IDENTITY = "Apple Distribution"/g' "$PBX"
            sed -i.bak 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer"/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution"/g' "$PBX"
            sed -i.bak 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "Apple Development"/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution"/g' "$PBX"
            sed -i.bak "s/PROVISIONING_PROFILE_SPECIFIER = \"[^\"]*\"/PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\"/g" "$PBX"
            sed -i.bak "s/PROVISIONING_PROFILE = \"[^\"]*\"/PROVISIONING_PROFILE = \"$PROFILE_UUID\"/g" "$PBX"
            sed -i.bak "s/PROVISIONING_PROFILE_SPECIFIER = ""/PROVISIONING_PROFILE_SPECIFIER = \"$PROFILE_NAME\"/g" "$PBX"
            sed -i.bak "s/PROVISIONING_PROFILE = ""/PROVISIONING_PROFILE = \"$PROFILE_UUID\"/g" "$PBX"
            # Force manual App Store signing on the app target only. Flutter templates
            # usually leave Runner's signing keys unset (implicitly Automatic), so the sed
            # rewrites above never reach them and xcodebuild fails with "Runner is
            # automatically signed for development, but a conflicting code signing
            # identity Apple Distribution has been manually specified". Rewrite every
            # XCBuildConfiguration whose PRODUCT_BUNDLE_IDENTIFIER is the app's bundle id
            # (RunnerTests and Swift packages are left alone).
            APP_BUNDLE_ID="${IOS_BUNDLE_ID:-}"
            if [ -z "$APP_BUNDLE_ID" ]; then
              APP_BUNDLE_ID=$(grep -oE 'PRODUCT_BUNDLE_IDENTIFIER = [^;]+;' "$PBX" | grep -v RunnerTests | head -1 | sed 's/.*= //;s/;//' | tr -d '"' || true)
            fi
            export TEAM_ID PROFILE_NAME PROFILE_UUID APP_BUNDLE_ID
            perl -0777 -i.bak3 -pe 's{(isa = XCBuildConfiguration;[^{}]*?buildSettings = \{)(.*?)(\n\t\t\t\};)}{my ($h,$b,$t)=($1,$2,$3); if ($b =~ /PRODUCT_BUNDLE_IDENTIFIER = "?\Q$ENV{APP_BUNDLE_ID}\E"?;/) { $b =~ s/\n[ \t]*"?(?:CODE_SIGN_STYLE|DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY(?:\[sdk=iphoneos\*\])?|PROVISIONING_PROFILE_SPECIFIER|PROVISIONING_PROFILE)"? = [^\n]*;//g; $b = "\n\t\t\t\tCODE_SIGN_STYLE = Manual;\n\t\t\t\tDEVELOPMENT_TEAM = $ENV{TEAM_ID};\n\t\t\t\tCODE_SIGN_IDENTITY = \"Apple Distribution\";\n\t\t\t\t\"CODE_SIGN_IDENTITY[sdk=iphoneos*]\" = \"Apple Distribution\";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = \"$ENV{PROFILE_NAME}\";\n\t\t\t\tPROVISIONING_PROFILE = \"$ENV{PROFILE_UUID}\";" . $b; } "$h$b$t"}gse' "$PBX"
            if ! grep -q 'CODE_SIGN_STYLE = Manual' "$PBX"; then
              echo "Could not apply manual App Store signing to $APP_BUNDLE_ID in $PBX"
              exit 1
            fi
            xcodebuild -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$ARCHIVE_PATH" \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              archive
          else
            echo "No App Store .mobileprovision — archive uses ASC API automatic signing."
            xcodebuild -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$ARCHIVE_PATH" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$ASC_KEY_PATH" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              archive
          fi

          if [ -n "$PROFILE_UUID" ]; then
            BUNDLE_ID="${IOS_BUNDLE_ID:-}"
            if [ -z "$BUNDLE_ID" ]; then
              BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleIdentifier' \
                "$ARCHIVE_PATH/Info.plist" 2>/dev/null || true)
            fi
            if [ -z "$BUNDLE_ID" ] && [ -f ios/Runner.xcodeproj/project.pbxproj ]; then
              BUNDLE_ID=$(grep -oE 'PRODUCT_BUNDLE_IDENTIFIER = [^;]+;' ios/Runner.xcodeproj/project.pbxproj \
                | head -1 | sed 's/.*= //;s/;//' || true)
            fi
            echo "Exporting with local App Store profile for $BUNDLE_ID"
            {
              echo '<?xml version="1.0" encoding="UTF-8"?>'
              echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
              echo '<plist version="1.0"><dict>'
              echo '  <key>method</key><string>app-store-connect</string>'
              echo '  <key>signingStyle</key><string>manual</string>'
              echo "  <key>teamID</key><string>$TEAM_ID</string>"
              echo '  <key>signingCertificate</key><string>Apple Distribution</string>'
              echo '  <key>provisioningProfiles</key><dict>'
              echo "    <key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>"
              echo '  </dict>'
              echo '  <key>uploadSymbols</key><true/>'
              echo '  <key>manageAppVersionAndBuildNumber</key><false/>'
              echo '</dict></plist>'
            } > ios/ExportOptions.plist

            xcodebuild -exportArchive \
              -archivePath "$ARCHIVE_PATH" \
              -exportOptionsPlist ios/ExportOptions.plist \
              -exportPath "$EXPORT_PATH"
          else
            echo "WARNING: no App Store .mobileprovision secret — trying ASC API automatic export."
            echo "If this fails with Cloud signing / No profiles, upload an App Store Connect profile in FlutterGo."
            {
              echo '<?xml version="1.0" encoding="UTF-8"?>'
              echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
              echo '<plist version="1.0"><dict>'
              echo '  <key>method</key><string>app-store-connect</string>'
              echo '  <key>signingStyle</key><string>automatic</string>'
              echo "  <key>teamID</key><string>$TEAM_ID</string>"
              echo '  <key>signingCertificate</key><string>Apple Distribution</string>'
              echo '  <key>uploadSymbols</key><true/>'
              echo '  <key>manageAppVersionAndBuildNumber</key><false/>'
              echo '</dict></plist>'
            } > ios/ExportOptions.plist

            xcodebuild -exportArchive \
              -archivePath "$ARCHIVE_PATH" \
              -exportOptionsPlist ios/ExportOptions.plist \
              -exportPath "$EXPORT_PATH" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$ASC_KEY_PATH" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          fi

          shopt -s nullglob
          ipa_files=("$EXPORT_PATH"/*.ipa)
          if [ ${#ipa_files[@]} -eq 0 ]; then
            echo "ERROR: xcodebuild export produced no .ipa in $EXPORT_PATH"
            ls -la "$EXPORT_PATH" || true
            exit 1
          fi
          ls -la "${ipa_files[@]}"

      - name: Keep the signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 7

      - name: Upload to TestFlight / App Store
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ipa_files=(build/ios/ipa/*.ipa)
          if [ ${#ipa_files[@]} -eq 0 ]; then
            echo "ERROR: no IPA found under build/ios/ipa/"
            exit 1
          fi
          IPA="${ipa_files[0]}"
          echo "Uploading $IPA to TestFlight…"
          xcrun altool --upload-app -f "$IPA" --type ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
